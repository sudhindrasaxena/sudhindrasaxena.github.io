<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps by Sudhindra</title>
<meta name="description" content="Android apps by Sudhindra Saxena, an independent developer in India.">
<style>
  :root { --bg: #faf3f6; --card: #ffffff; --text: #1e1a1d; --muted: #6a5a64; --accent: #8e2d78; --mint: #7cf5c5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141015; --card: #1f1920; --text: #ede0e7; --muted: #d6c2cf; --accent: #ffaee3; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: linear-gradient(135deg, #3a1c71, #d76d77 55%, #ffaf7b); color: #fff;
           padding: 48px 16px 40px; border-radius: 0 0 36px 36px; }
  header div, main { max-width: 760px; margin: 0 auto; }
  header h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: -0.5px; }
  header p { margin: 0; opacity: .9; }
  main { padding: 24px 16px 64px; }
  .app { background: var(--card); border-radius: 24px; padding: 20px 24px; margin-bottom: 16px;
         border-left: 6px solid var(--mint); }
  .app h2 { margin: 0 0 4px; font-size: 1.25rem; }
  .app p { margin: 0 0 8px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Apps by Sudhindra</h1>
    <p>Small, private, useful Android apps · independent developer, India</p>
  </div>
</header>
<main>
  <div class="app">
    <h2>QR Reader</h2>
    <p>Scan QR codes and barcodes. Your scans stay on your phone, and links are checked before you open them.</p>
    <p><a href="qr-reader/privacy/">Privacy policy</a></p>
  </div>
  <p class="muted">Contact: <a href="mailto:sudhindraks.dev@gmail.com">sudhindraks.dev@gmail.com</a></p>
</main>
</body>
</html>
